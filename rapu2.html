<h2>Faniposti</h2>

<input type="text" id="message" placeholder="Kirjoita faniposti">
<button onclick="sendMessage()">Lähetä</button>

<script>
    
let lastSent = 0;

async function sendMessage() {

    const now = Date.now();

    if (now - lastSent < 30000){
            alert("Pojuuu älä spämmää (odota 30 sec)")
            return;
    }

  const message = document.getElementById("message").value;

  const webhookURL = "https://discord.com/api/webhooks/1508820105029615748/BAnL-fYyIbqaA_SAk0ZMCUNwe_eLwhh4pknLnivK05kyVyTZsCu7JhHIC1KZ4SEqNrUt";

  await fetch(webhookURL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      content: message
    })
  });

  lastSent = Date.now();

  alert("Viesti on lähetetty kiitos!");
}
</script>
